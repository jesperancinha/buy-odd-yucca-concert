name: BOYC Build on PR

on:
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
        - uses: actions/checkout@v7
        - name: Set up JDK 25
          uses: actions/setup-java@v5
          with:
            java-version: '25'
            distribution: 'adopt'

        - name: Build and Test
          uses: nick-fields/retry@v4
          with:
            max_attempts: 2
            retry_on: error
            timeout_seconds: 2400
            command: |
              make report
