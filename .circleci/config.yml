version: 2

orbs:
  qodana: jetbrains/qodana@2026.1

jobs:
  build-maven:
    machine:
      image: ubuntu-2204:2023.04.2

    working_directory: ~/repo

    steps:
      - checkout

      - run:
          name: Install SDK 25
          command: wget https://github.com/adoptium/temurin25-binaries/releases/download/jdk-25.0.3%2B9/OpenJDK25U-jdk_x64_linux_hotspot_25.0.3_9.tar.gz &&
            tar -xvf OpenJDK25U-jdk_x64_linux_hotspot_25.0.3_9.tar.gz &&
            sudo mv jdk-25*/ /opt/jdk25 &&
            export JAVA_HOME=/opt/jdk25 &&
            echo "export JAVA_HOME=/opt/jdk25" >> ~/.bashrc &&
            echo "export PATH=$JAVA_HOME/bin:$PATH" >> ~/.bashrc

      - run:
          name: Java Version Check
          command: java -version

      - run:
          name: Maven Clean Install
          command: mvn clean install

  build-yarn:
    docker:
      - image: cimg/node:24.0.0

    working_directory: ~/repo

    steps:
      - checkout

      - run:
          command: yarn --force
          working_directory: buy-odd-yucca-gui

      - run:
          command: yarn
          working_directory: buy-odd-yucca-gui
  code-quality:
    machine:
      image: 'ubuntu-2004:current'
    steps:
      - checkout
      - qodana/scan:
          args: -l jetbrains/qodana-jvm # use space to separate arguments

workflows:
  version: 2
  build_all:
    jobs:
      - build-maven
      - build-yarn
  main:
    jobs:
      - code-quality:
          context: qodana

